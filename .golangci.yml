version: "2"

run:
  timeout: 10m

output:
  formats:
    text:
      colors: true

linters:
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - fmt.*
        - io/ioutil.Read.*

    govet:
      disable:
        - shadow

    gocyclo:
      min-complexity: 10

    dupl:
      threshold: 100

    goconst:
      min-len: 3
      min-occurrences: 5

    lll:
      tab-width: 1

    unparam:
      check-exported: false

    nakedret:
      max-func-lines: 30

    prealloc:
      simple: true
      range-loops: true
      for-loops: false

    gocritic:
      enabled-tags:
        - performance
      settings:
        captLocal:
          paramsOnly: true
        rangeValCopy:
          sizeThreshold: 32

    revive:
      confidence: 0.8

  enable:
    - errcheck
    - govet
    - gocyclo
    - gocritic
    - goconst
    - prealloc
    - revive
    - unconvert
    - misspell
    - nakedret
    - staticcheck
    - gosec
    - unused
    - unparam

  exclusions:
    paths:
      - "zz_generated\\..+\\.go$"
    rules:
      - path: '_test(ing)?\.go'
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec
          - unparam

      - path: '_test\.go'
        text: "(unnamedResult|exitAfterDefer)"
        linters:
          - gocritic

      - text: "(hugeParam|rangeValCopy):"
        linters:
          - gocritic

      - text: "SA3000:"
        linters:
          - staticcheck

      - text: "G101:"
        linters:
          - gosec

      - text: "G104:"
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/mistermx/crossbuilder/v2
  exclusions:
    paths:
      - "zz_generated\\..+\\.go$"

issues:
  new: false
  max-issues-per-linter: 0
  max-same-issues: 0
